<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3ede0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131711" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calorías">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Mis calorías</title>
<style>
:root{
  color-scheme: light;
  --bg:#f3ede0; --surface:#fcfaf4; --ink:#1f2a22; --ink2:#55604f; --muted:#85897a;
  --grid:#e7dfcc; --axis:#cfc6b0; --ring:rgba(60,50,25,.10); --wash:#ece5d3;
  --shadow:0 1px 2px rgba(60,50,25,.05),0 6px 20px rgba(60,50,25,.07);
  --s1:#1f8550; --s2:#c28a1f; --s3:#3f78c0; --s1-track:#d9e6d3;
  --good:#25703f; --warn:#946610; --bad:#b5473b; --accent:#2b7048; --onaccent:#fcfaf4;
  --topbg:rgba(243,237,224,.9);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#131711; --surface:#1c221a; --ink:#efebdd; --ink2:#bdb9a6; --muted:#8c8f7e;
    --grid:#2a3127; --axis:#3a4236; --ring:rgba(239,235,221,.09); --wash:#252c22;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    --s1:#63c487; --s2:#e8b64a; --s3:#7aa7e6; --s1-track:#27392c;
    --good:#8cc59a; --warn:#e3b04a; --bad:#e58a7c; --accent:#63c487; --onaccent:#10170f;
    --topbg:rgba(19,23,17,.9);
  }
}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
#app{max-width:560px;margin:0 auto;padding:0 14px 20px}
h1{font-size:30px;margin:0;font-weight:760;letter-spacing:-.7px;line-height:1.1}
h2{font-size:16px;margin:0 0 10px;font-weight:700}
h3{font-size:13px;margin:14px 0 6px;color:var(--ink2);font-weight:650}
.card{background:var(--surface);border-radius:18px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow);border:1px solid var(--ring)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sp{justify-content:space-between}
.muted{color:var(--muted)} .ink2{color:var(--ink2)} .small{font-size:13px} .tiny{font-size:11.5px}
.big{font-size:38px;font-weight:760;line-height:1;letter-spacing:-1px}
.mid{font-size:20px;font-weight:680;line-height:1.15}
.good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.hide{display:none!important}
button,.btn{font:inherit;border:1px solid var(--ring);background:var(--wash);color:var(--ink);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer;touch-action:manipulation}
button.primary{background:var(--accent);color:var(--onaccent);border-color:transparent;font-weight:650}
button.ghost{background:transparent;border-color:transparent}
button.danger{color:var(--bad)}
button.sm{min-height:34px;padding:6px 11px;font-size:14px;border-radius:10px}
button:disabled{opacity:.45;cursor:default}
button.full{width:100%}
input,select,textarea{box-sizing:border-box;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--axis);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea{min-height:84px;resize:vertical}
label{display:block;font-size:12.5px;color:var(--ink2);margin:0 0 4px}
.field{margin:0 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* Cabecera por días */
.top{position:sticky;top:0;z-index:4;background:var(--topbg);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);margin:0 -14px 12px;padding:12px 14px 10px;border-bottom:1px solid var(--ring)}
.toprow{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.navbtn{min-width:40px;min-height:40px;padding:0;border-radius:99px;font-size:22px;line-height:1;background:var(--wash)}
.datebox{position:relative;flex:1;min-width:0;padding:0 4px}
.datebox input{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;cursor:pointer}
.dsub{font-size:13px;color:var(--ink2);margin-top:2px}
.todaybtn{font-size:13px;min-height:32px;padding:4px 12px;border-radius:99px;color:var(--accent);font-weight:650;background:var(--wash)}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{border-radius:14px;padding:7px 0 6px;text-align:center;background:var(--surface);border:1px solid var(--ring);min-height:0;display:block}
.wd .l{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.wd .n{display:block;font-size:17px;font-weight:680;line-height:1.25}
.wd .st{display:block;width:7px;height:7px;border-radius:99px;margin:3px auto 0;background:var(--grid)}
.wd.sel{background:var(--accent);border-color:transparent;color:var(--onaccent)}
.wd.sel .l{color:rgba(255,255,255,.8)}
.wd.sel .st{box-shadow:0 0 0 1.5px var(--onaccent)}
.wd.today:not(.sel) .n{color:var(--accent)}
.wd:disabled{opacity:.35}
.st.d{background:var(--s1)} .st.s{background:var(--s2)} .st.m{background:var(--s3)}
.wd.sel .st.d,.wd.sel .st.s,.wd.sel .st.m{background:var(--onaccent)}

/* Anillo */
.hero{display:flex;gap:16px;align-items:center}
.ringwrap{position:relative;width:148px;height:148px;flex:none}
.ringwrap svg{display:block}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringc b{font-size:30px;line-height:1;letter-spacing:-.8px;font-weight:760}
.ringc span{font-size:11.5px;color:var(--muted);margin-top:3px}
.stats{flex:1;min-width:0}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font-size:14px}
.stat b{font-size:16px}
.pill{display:inline-flex;gap:6px;align-items:center;border-radius:99px;padding:5px 11px;font-size:13px;font-weight:650;background:var(--wash)}
.pill.d{background:var(--s1-track);color:var(--accent)} .pill.s{background:rgba(194,138,31,.16);color:var(--s2)} .pill.m{background:rgba(63,120,192,.14);color:var(--s3)}
.meter{height:10px;border-radius:99px;background:var(--s1-track);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--s1);border-radius:99px}
.meter.over>i{background:var(--s2)}
.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.macro .m1{text-align:left}
.macro .m1 .v{font-size:19px;font-weight:700;margin-top:3px;letter-spacing:-.3px}
.macro .m1 .v small{font-size:12px;color:var(--muted);font-weight:500}
.macro .m1 .meter{height:6px;margin-top:6px;background:var(--grid)}
.dot{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:6px;vertical-align:middle}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:8px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--grid);font-size:14.5px}
.kv:last-child{border-bottom:0}

/* Franjas de comida */
.sec{background:var(--surface);border-radius:18px;margin:0 0 10px;box-shadow:var(--shadow);border:1px solid var(--ring);overflow:hidden}
.sech{display:flex;align-items:center;gap:10px;padding:12px 14px}
.sech .ico{font-size:22px;width:30px;text-align:center}
.sech .tt{flex:1;min-width:0}
.sech .tt b{display:block;font-size:15.5px}
.sech .tt span{font-size:12.5px;color:var(--muted)}
.addb{min-width:40px;min-height:40px;padding:0;border-radius:99px;font-size:24px;line-height:1;background:var(--accent);color:var(--onaccent);border-color:transparent}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--grid);cursor:pointer;width:100%;text-align:left;background:transparent;border-radius:0;border-left:0;border-right:0;border-bottom:0;min-height:56px}
.mrow .nm{flex:1;min-width:0}
.mrow .nm b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .nm span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .kc{font-weight:700;font-size:15px;text-align:right}
.mrow .kc span{display:block;font-size:11.5px;color:var(--muted);font-weight:500}

/* Hojas (editor) */
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.open{display:block}
#sheet.full{background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;animation:up .22s ease-out}
#sheet.bottom{background:rgba(0,0,0,.4);animation:fade .18s}
.sheetin{max-width:560px;margin:0 auto;padding:0 14px calc(110px + env(safe-area-inset-bottom))}
.stop{position:sticky;top:0;z-index:2;background:var(--bg);margin:0 -14px 12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--ring)}
.stop h1{font-size:19px;flex:1;text-align:center;letter-spacing:-.3px}
.stop button{min-width:64px}
.sbar{position:fixed;left:0;right:0;bottom:0;background:var(--topbg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--ring);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:3}
.sbar>div{max-width:560px;margin:0 auto;display:flex;gap:12px;align-items:center}
.sbar .tot{flex:1;min-width:0;line-height:1.2}
.sbar .tot b{font-size:20px;display:block;letter-spacing:-.4px}
.sbar .tot span{font-size:12.5px;color:var(--ink2)}
.sbar button{min-width:120px}
.menu{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.menu .handle{width:40px;height:4px;background:var(--axis);border-radius:9px;margin:0 auto 14px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;margin:0 auto}
.mbtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:16px;min-height:88px;text-align:left}
.mbtn .e{font-size:26px} .mbtn b{font-size:15px} .mbtn span{font-size:12px;color:var(--ink2)}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--axis);border-radius:99px;padding:8px 13px;font-size:14.5px;background:var(--surface);cursor:pointer;min-height:40px}
.chip.on{background:var(--accent);color:var(--onaccent);border-color:transparent;font-weight:650}
.seg2{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--wash);border-radius:12px;padding:3px;gap:3px}
.seg2 button{border:0;background:transparent;border-radius:9px;min-height:38px;padding:6px}
.seg2 button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:650}
.photobox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px dashed var(--axis);border-radius:16px;min-height:120px;width:100%;background:transparent;color:var(--ink2)}
.photobox .e{font-size:30px}
.preview{width:100%;max-height:260px;object-fit:cover;border-radius:16px;display:block}
.pvwrap{position:relative;margin-bottom:6px}
.pvwrap button{position:absolute;top:8px;right:8px;min-height:34px;min-width:34px;padding:0;border-radius:99px;background:rgba(0,0,0,.55);color:var(--onaccent);border:0}
.item{display:grid;grid-template-columns:1fr 84px 34px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--grid)}
.item .nm{font-size:14.5px;min-width:0}
.item input{padding:8px;min-height:40px;text-align:right}
.item button{padding:0;min-height:34px;width:34px;border-radius:10px}
.badge{display:inline-block;font-size:11.5px;border-radius:99px;padding:2px 8px;border:1px solid var(--axis);color:var(--ink2)}
.pill-ok{color:var(--good);border-color:var(--good)} .pill-mid{color:var(--warn);border-color:var(--warn)} .pill-bad{color:var(--bad);border-color:var(--bad)}
.banner{background:var(--surface);border:1px solid var(--ring);border-left:4px solid var(--accent);border-radius:14px;padding:12px 14px;margin:0 0 12px;font-size:14px;box-shadow:var(--shadow)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{min-width:48px;font-size:22px;padding:0}
.stepper input{text-align:center;font-size:22px;font-weight:700}
.bignum{font-size:44px;font-weight:760;text-align:center;letter-spacing:-1px;line-height:1.1;margin:6px 0}
.dayrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--grid);width:100%;text-align:left;background:transparent;border-radius:0;border-left:0;border-right:0;border-bottom:0;min-height:68px}
.dayrow:first-child{border-top:0}
.dayrow .dn{width:42px;text-align:center;flex:none}
.dayrow .dn b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600}
.dayrow .dn span{font-size:22px;font-weight:700;line-height:1.1}
.dayrow.today .dn span{color:var(--accent)}
.dayrow .mid2{flex:1;min-width:0}
.dayrow .mid2 .meter{height:7px;margin:5px 0 4px}
.dayrow.fut{opacity:.4}

/* Pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--topbg);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--ring);display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{border:0;background:transparent;border-radius:10px;font-size:11px;color:var(--ink2);padding:4px 0 2px;min-height:50px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent);font-weight:650}
.tabs .plus{align-self:center;justify-self:center;width:56px;min-height:56px;height:56px;border-radius:99px;background:var(--accent);color:var(--onaccent);font-size:30px;line-height:1;padding:0;margin-top:-18px;box-shadow:0 6px 16px rgba(42,120,214,.45);display:flex;align-items:center;justify-content:center}
.plus span{margin-top:-3px}
details{margin:6px 0 0} summary{cursor:pointer;color:var(--accent);font-size:14px;padding:6px 0;min-height:36px;display:flex;align-items:center}
details ol{padding-left:20px;margin:6px 0;font-size:14px} details li{margin:5px 0}
code,pre{font:12.5px ui-monospace,Menlo,monospace;background:var(--wash);border-radius:8px}
pre{padding:10px;overflow:auto;white-space:pre-wrap;margin:6px 0}
svg text{font-family:system-ui,-apple-system,sans-serif;fill:var(--muted)}
.chart{width:100%;height:auto;display:block;touch-action:manipulation}
.readout{min-height:20px;font-size:13px;color:var(--ink2);margin:2px 0 4px}
table{width:100%;border-collapse:collapse;font-size:13px} th,td{padding:6px 4px;border-bottom:1px solid var(--grid);text-align:right} th:first-child,td:first-child{text-align:left}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.5);border-top-color:var(--onaccent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.pt{padding-top:calc(14px)}

/* Entreno de fuerza */
.gx{padding:14px 12px}
.gs{display:grid;grid-template-columns:34px minmax(0,1fr) 74px 74px 46px;gap:6px;align-items:center;margin:0 0 6px}
.gs.gh{font-size:11.5px;color:var(--muted);margin-bottom:4px;text-align:center}
.gs.gh span:first-child,.gs.gh span:nth-child(2){text-align:left}
.gs input{text-align:center;font-weight:650;min-height:42px;padding:6px 4px;border-radius:10px}
.gs input.gw2{grid-column:span 2}
.gs.gh .gw2{grid-column:span 2}
.gs .gp{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs .gn{min-height:34px;min-width:34px;padding:0;border-radius:10px;font-weight:700;font-size:14px;background:var(--wash)}
.gs .gn.w{background:rgba(194,138,31,.2);color:var(--s2)}
.gs .gn.f{background:rgba(181,71,59,.18);color:var(--bad)}
.gs .gk{min-height:42px;min-width:44px;padding:0;border-radius:10px;font-size:18px;color:var(--muted)}
.gs .gk.on{background:var(--accent);color:var(--onaccent);border-color:transparent}
.gs.done input{background:var(--s1-track);border-color:transparent}
.grest{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:2;border-color:var(--accent);background:var(--s1-track)}
.gdone{min-height:38px;padding:6px 14px;border-radius:10px}
.gdone.on{background:var(--accent);color:var(--onaccent);border-color:transparent}
.gpick{align-items:center}

.gs input[type=number]{-moz-appearance:textfield;appearance:textfield;min-width:0}
.gs input::-webkit-outer-spin-button,.gs input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.grest{padding:8px 12px;margin-bottom:8px}
.grest .mid{font-size:22px}
.gs input::placeholder{color:var(--muted);opacity:.65;font-weight:500}

</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<nav class="tabs" id="tabs"></nav>

<script>
/* Cálculos puros (sin DOM). Se usa en el navegador (global CC) y en tests de Node. */
(function (root) {
  'use strict';

  var KCAL_KG = 7700;          // kcal por kg de peso corporal (aprox.)
  var LOGGED_MIN = 800;        // kcal mínimas para considerar un día "registrado"

  var ACT = {
    sed:  { f: 1.2,  label: 'Sedentaria (estudio/oficina, pocos pasos)' },
    lig:  { f: 1.3,  label: 'Ligera (algo de movimiento, ~7-10k pasos)' },
    mod:  { f: 1.4,  label: 'Moderada (de pie / andando mucho, ~10-15k pasos)' },
    alta: { f: 1.55, label: 'Alta (trabajo físico)' }
  };

  // METs (Compendio de Actividades Físicas) [ligera, moderada, intensa]
  var SPORTS = {
    gym:      { label: 'Entreno de fuerza',    met: [4.0, 5.0, 6.0],   strength: true },
    pesas:    { label: 'Pesas / gimnasio',     met: [3.5, 5.0, 6.0],   strength: true },
    calis:    { label: 'Calistenia',           met: [3.8, 5.0, 8.0],   strength: true },
    correr:   { label: 'Correr',               met: [8.3, 9.8, 11.8] },
    caminar:  { label: 'Caminar',              met: [3.0, 4.3, 5.0] },
    bici:     { label: 'Bicicleta',            met: [4.0, 8.0, 10.0] },
    nadar:    { label: 'Natación',             met: [5.8, 8.0, 9.8] },
    hiit:     { label: 'HIIT / Crossfit',      met: [6.0, 8.0, 10.0] },
    futbol:   { label: 'Fútbol',               met: [7.0, 8.5, 10.0] },
    baloncesto:{label: 'Baloncesto',           met: [6.0, 6.5, 8.0] },
    padel:    { label: 'Pádel / tenis',        met: [5.0, 6.0, 7.3] },
    boxeo:    { label: 'Boxeo / artes marc.',  met: [5.5, 7.8, 10.3] },
    eliptica: { label: 'Elíptica / remo',      met: [4.8, 6.0, 8.5] },
    yoga:     { label: 'Yoga / movilidad',     met: [2.3, 3.0, 4.0] },

  /* ====================== Gráficos ====================== */
  function barPath(x, w, y0, y1, r) {
    var h = Math.abs(y1 - y0); if (h < 1) return ''; r = Math.min(r, h, w / 2);

  }
  function ringSvg(pct, over) {
    var size = 148, sw = 13, r = size / 2 - sw / 2 - 2, c = 2 * Math.PI * r, p = Math.max(0, Math.min(1, pct));
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" role="img" aria-label="Progreso de calorías del día">' +
      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="var(--s1-track)" stroke-width="' + sw + '"/>' +
      (p > 0 ? '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + (over ? 'var(--s2)' : 'var(--s1)') + '" stroke-width="' + sw + '" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + (c * (1 - p)).toFixed(1) + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"/>' : '') + '</svg>';
  }
  function weightChart(ctx) {
    var from = CC.addDays(TODAY, -60);
    var pts = ctx.trend.filter(function (p) { return p.d >= from; });
    if (pts.length < 2) return '<p class="muted small">Registra al menos 2 pesajes para ver la gráfica.</p>';
    var W = 520, H = 210, L = 40, R = 16, T = 12, B = 26;
    var lo = Infinity, hi = -Infinity;
    pts.forEach(function (p) { lo = Math.min(lo, p.raw, p.t); hi = Math.max(hi, p.raw, p.t); });
    lo = Math.floor((lo - 0.4) * 2) / 2; hi = Math.ceil((hi + 0.4) * 2) / 2; if (hi - lo < 2) hi = lo + 2;
    var x0 = pts[0].d, span = Math.max(1, CC.diffDays(x0, pts[pts.length - 1].d));
    function X(d) { return L + (W - L - R) * CC.diffDays(x0, d) / span; }
    function Y(v) { return T + (H - T - B) * (1 - (v - lo) / (hi - lo)); }
    var g = '', i, steps = 4;
    for (i = 0; i <= steps; i++) {
      var v = lo + (hi - lo) * i / steps, y = Y(v);
      g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke="var(--grid)" stroke-width="1"/><text x="' + (L - 6) + '" y="' + (y + 4) + '" font-size="11" text-anchor="end">' + f1(v) + '</text>';
    }
    var line = pts.map(function (p, k) { return (k ? 'L' : 'M') + X(p.d).toFixed(1) + ',' + Y(p.t).toFixed(1); }).join('');
    var raw = pts.map(function (p) { return '<circle cx="' + X(p.d).toFixed(1) + '" cy="' + Y(p.raw).toFixed(1) + '" r="3" fill="var(--muted)" opacity=".7"/>'; }).join('');
    var last = pts[pts.length - 1];
    var hit = pts.map(function (p, k) { return '<circle data-act="wpt" data-i="' + k + '" cx="' + X(p.d).toFixed(1) + '" cy="' + Y(p.t).toFixed(1) + '" r="13" fill="transparent"/>'; }).join('');
    var ax = '<text x="' + L + '" y="' + (H - 6) + '" font-size="11">' + dmy(pts[0].d) + '</text><text x="' + (W - R) + '" y="' + (H - 6) + '" font-size="11" text-anchor="end">' + dmy(last.d) + '</text>';
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Evolución del peso">' + g + raw +
      '<path d="' + line + '" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + X(last.d).toFixed(1) + '" cy="' + Y(last.t).toFixed(1) + '" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>' + ax + hit + '</svg>' +
      '<div class="legend"><span><i class="dot" style="background:var(--s1)"></i>Tendencia</span><span><i class="dot" style="background:var(--muted);opacity:.7"></i>Pesajes</span></div>';
  }

  function totalsOf(items) { var t = { k: 0, p: 0, c: 0, f: 0 }; items.forEach(function (i) { t.k += i.k; t.p += i.p; t.c += i.c; t.f += i.f; }); return t; }
  function renderDraft() {

          '<div class="tiny muted" id="ik' + k + '">' + fmt(i.k) + ' kcal · P ' + f1(i.p) + ' · H ' + f1(i.c) + ' · G ' + f1(i.f) + '</div></div>' +

      if (d.note) h += '<p class="small ink2">ℹ️ ' + esc(d.note) + '</p>';

      '<div class="grid3"><div class="field"><label>Prot. /100 g</label><input id="mp" type="number" inputmode="decimal" placeholder="75"></div><div class="field"><label>Hidr. /100 g</label><input id="mc" type="number" inputmode="decimal" placeholder="6"></div><div class="field"><label>Grasa /100 g</label><input id="mf" type="number" inputmode="decimal" placeholder="5"></div></div>' +

    h += '<div class="card"><label class="row" style="color:var(--ink);font-size:15px;margin:0"><input type="checkbox" style="width:22px;min-height:22px" data-bind="fav"' + (d.fav ? ' checked' : '') + '> ⭐ Guardar como favorito (repetirla en un toque)</label></div>';

  function updWork() { var e = workEst(), a = $('#westim'), b = $('#westim2'), p = $('[data-bind="wkcal"]'); if (a) a.textContent = fmt(e.est); if (b) b.textContent = fmt(CC.num(V.work.kcal) > 0 ? CC.num(V.work.kcal) : e.est) + ' kcal'; if (p) p.placeholder = fmt(e.est); }

  /* ====================== PROGRESO ====================== */
  /* ---------- Ayuno ---------- */
  function fastCard(isToday) {

      if (f.first === null) return '';

    h += '<div style="font-size:28px;font-weight:700;margin:6px 0 4px" ' + (f.ongoing ? 'id="fastlive" data-prev="' + f.prevLast + '"' : '') + '>' + fmtH(f.hours) + '</div>';
    h += '<div style="height:8px;border-radius:99px;background:var(--s1-track);overflow:hidden"><div id="fastbar" style="height:100%;width:' + pct.toFixed(0) + '%;background:' + (ok ? 'var(--good)' : 'var(--s1)') + '"></div></div>';
    if (f.ongoing) h += '<div class="small ink2" style="margin-top:8px">Ayunando desde tu última comida de ayer (<b>' + CC.hm(f.prevLast) + '</b>). ' + (ok ? 'Ya has superado el objetivo.' : 'Te faltan <b id="fastleft">' + fmtH(goal - f.hours) + '</b> para llegar a ' + goal + ' h.') + '</div>';

    return h + '<div class="tiny muted" style="margin-top:6px">☕ Café solo, infusiones y similares (hasta ' + CC.FAST_BREAK + ' kcal) no rompen el ayuno.</div></div>';
  }

    var goal = st.goal, bars = st.list.slice().reverse().map(function (x) {

    }).join('');

  function viewProgreso() {

      '<div><div class="mid">' + f1(cur) + '</div><div class="muted tiny">kg (tendencia)</div></div>' +

      if (g <= 0) { V.draft.err = 'Indica los gramos que comes.'; renderDraft(); return; }

    }
  };
  Object.keys(GYM_ACTIONS).forEach(function (k) { ACTIONS[k] = GYM_ACTIONS[k]; });


  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) { if (V.sheet === 'menu' && e.target.id === 'sheet') closeSheet(); return; }
    if (t.dataset.act === 'noop') return;
    var a = ACTIONS[t.dataset.act]; if (a) a(t, e);
  });
  document.addEventListener('input', function (e) {
    var t = e.target, b = t.dataset && t.dataset.bind; if (!b) return;
    if (b.indexOf('gy') === 0) { gInput(t); return; }
    var d = V.draft;
    if (b === 'desc') d.desc = t.value;
    else if (b === 'name') { d.name = t.value; d.nameEdited = true; }
    else if (b === 'refine') d.refine = t.value;
    else if (b === 'itemg') {
      var it = d.items[+t.dataset.i]; if (!it) return; var g = Math.max(0, CC.num(t.value));
      it.g = g; it.k = Math.round(it.dk * g); it.p = CC.round(it.dp * g, 1); it.c = CC.round(it.dc * g, 1); it.f = CC.round(it.df * g, 1); updateTotals();
    } else if (b === 'wmin') { V.work.min = t.value; updWork(); }
    else if (b === 'wkcal') { V.work.kcal = t.value; updWork(); }
    else if (b === 'kg') { V.wt.kg = CC.num(t.value); }
  });
  document.addEventListener('change', async function (e) {
    var t = e.target, b = t.dataset && t.dataset.bind;
    if (t.id === 'photoIn') {
      var f = t.files && t.files[0]; if (!f) return; var d = V.draft; if (!d) return;
      d.err = ''; d.busy = true; renderDraft();
      try { d.photo = await (window.__prepPhoto || prepPhoto)(f); } catch (x) { d.err = 'No he podido leer esa foto. Prueba con otra.'; }
      d.busy = false; renderDraft(); return;
    }
    if (!b) return;
    if (b.indexOf('gy') === 0) { gInput(t); return; }
    if (b === 'jump') { if (t.value && t.value <= TODAY) { V.date = t.value; render(); } }
    else if (b === 'date') V.draft.date = t.value || TODAY;
    else if (b === 't') V.draft.t = t.value || '';
    else if (b === 'fav') V.draft.fav = t.checked;
    else if (b === 'wdate') { V.wt.date = t.value || TODAY; $('#sheet').innerHTML = weightHtml(); }
    else if (b === 'wfast') V.wt.fasted = t.checked;
    else if (b === 'kg') { V.wt.kg = CC.num(t.value); $('#sheet').innerHTML = weightHtml(); }
    else if (b === 'wmin') { V.work.min = t.value; $('#sheet').innerHTML = workHtml(); }
  });

  /* Deslizar entre días */
  var tx = 0, ty = 0, tt = 0;
  document.addEventListener('touchstart', function (e) { var p = e.changedTouches[0]; tx = p.clientX; ty = p.clientY; tt = Date.now(); }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (V.tab !== 'hoy' || V.sheet) return;
    if (e.target.closest && e.target.closest('input,textarea,select,.weekstrip')) return;
    var p = e.changedTouches[0], dx = p.clientX - tx, dy = p.clientY - ty;
    if (Date.now() - tt < 600 && Math.abs(dx) > 70 && Math.abs(dy) < 45) stepDay(dx > 0 ? -1 : 1);
  }, { passive: true });

  /* ====================== Arranque ====================== */
  function importHealth(txt, atMin) {
    var r = CC.parseHealth(txt, TODAY), day = dayOf(r.date, true);
    day.health = { steps: r.steps, active: r.active, resting: r.resting, workouts: r.workouts, ts: Date.now() };
    if (r.date === TODAY) { var nw = new Date(); day.health.at = atMin != null ? atMin : nw.getHours() * 60 + nw.getMinutes(); }
    if (r.weight >= 30 && r.weight <= 300) addWeight(r.date, r.weight, false);
    touchDay(r.date);
    return '✓ Importado ' + dmy(r.date) + ': ' + fmt(r.steps) + ' pasos, ' + fmt(r.active) + ' kcal activas' + (r.weight ? ', peso ' + f1(r.weight) + ' kg' : '') + (r.workouts.length ? ', ' + r.workouts.length + ' entreno(s)' : '') + '.';
  }
  // El Atajo abre la app con los datos en la dirección: /?fecha=2026-11-11&pasos=8234&activas=412&reposo=1790
  function applyPendingImport() {
    var p = lsGet('pendimp'); if (!p) return false;
    if (BUILD === 'web' && CFG.ok && !Store.pulled) return false;
    lsDel('pendimp');
    try {
      var txt = p.lines; if (!/(^|\n)fecha=/.test(txt)) txt = 'fecha=' + p.date + '\n' + txt;
      var msg = importHealth(txt, p.at); V.hmsg = msg; V.tab = 'hoy';
      setTimeout(function () { toast(msg.replace('✓ ', '')); }, 300);
      return true;
    } catch (e) { V.hmsg = 'No he podido leer los datos del Atajo: ' + (e.message || ''); V.tab = 'ajustes'; return true; }
  }
  function importFromUrl() {
    try {
      var q = new URLSearchParams(location.search), keys = ['fecha', 'pasos', 'activas', 'reposo', 'peso'], lines = [];
      keys.forEach(function (k) { if (q.get(k)) lines.push(k + '=' + q.get(k)); });
      if (!lines.length) return;
      var nw = new Date();
      // Se guarda como pendiente: no se escribe nada hasta haber descargado tus datos de Supabase.
      lsSet('pendimp', { lines: lines.join('\n'), at: nw.getHours() * 60 + nw.getMinutes(), date: TODAY });
      history.replaceState(null, '', location.pathname);
      V.tab = 'hoy';
    } catch (e) { V.hmsg = 'No he podido leer los datos del Atajo: ' + (e.message || '') + ' · Recibido: ' + decodeURIComponent(location.search).slice(0, 160); try { history.replaceState(null, '', location.pathname); } catch (x) {} V.tab = 'ajustes'; }
  }

  loadLocal();
  if (BUILD === 'web') importFromUrl();
  if (!S.profile.done && !S.weights.length) V.tab = 'ajustes';
  (async function () {
    if (BUILD === 'web') { render(); await loadConfig(); }
    render();
    initAI();
    await initRemote();
    if (applyPendingImport()) render();
  })();
  try { if (BUILD === 'web' && navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if (BUILD === 'web' && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
  // Si la app queda abierta de un día para otro, vuelve a "hoy" al reabrirla
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (Store.kind === 'supabase') syncNow(true);
    var nt = CC.ymd(new Date());
    if (nt !== TODAY) { var was = V.date === TODAY; TODAY = nt; if (was) V.date = nt; V.weekStart = mondayOf(V.date); if (!V.sheet) render(); }
  });
})();

</script>
</body>
</html>
